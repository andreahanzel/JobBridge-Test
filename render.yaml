services:
  - type: web
    name: jobbridge
    runtime: docker
    buildCommand: dotnet publish -c Release -o out
    startCommand: cd out && dotnet JobBridge.dll
    envVars:
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
    disk:
      name: jobbridge-data
      mountPath: /app/data
      sizeGB: 1